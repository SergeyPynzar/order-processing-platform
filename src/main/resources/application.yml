spring:
  application:
    name: order-processing-platform
  output:
    ansi:
      enabled: always
  datasource:
    url: jdbc:postgresql://127.0.0.1:5433/order-processing
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    change-log: classpath:db.changelog/changelog.yaml

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: 8080

logging:
  level:
    root: INFO
    ru.com.orderplatform: DEBUG
